<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 카드 만들기</title>
<style>
  :root {
    --bg: #fff8f4;
    --card: #ffffff;
    --ink: #3b2a30;
    --muted: #7d6b71;
    --line: #ecd9df;
    --accent: #d6336c;
    --accent-ink: #ffffff;
    --soft: #ffe3ec;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1417;
      --card: #2a1f23;
      --ink: #f6e9ee;
      --muted: #b9a3ab;
      --line: #4a3840;
      --accent: #ff6b9d;
      --accent-ink: #2a0f1a;
      --soft: #4a2633;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans CJK KR", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 14px 8px; font: inherit; font-size: 17px; font-weight: 700;
    border: 2px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink);
  }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; margin-bottom: 14px;
  }
  .step h2 { font-size: 17px; margin: 0 0 10px; }
  .step h2 span { color: var(--accent); margin-right: 4px; }
  canvas.preview {
    width: 100%; height: auto; display: block; border-radius: 14px;
    background: var(--soft); touch-action: none;
  }
  #vcanvas { max-width: 320px; margin-inline: auto; }
  .tpls { display: flex; gap: 8px; flex-wrap: wrap; }
  .tpl {
    flex: 1 1 calc(50% - 8px); padding: 12px 8px; font: inherit; font-weight: 600;
    border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
  }
  .tpl[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
  .btn {
    display: block; width: 100%; padding: 16px; font: inherit; font-size: 18px; font-weight: 700;
    border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  }
  .btn.second { background: var(--soft); color: var(--ink); border: 2px solid var(--line); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row > * { flex: 1; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 15px; }
  input[type=text] {
    width: 100%; padding: 12px; font: inherit; font-size: 17px; color: var(--ink);
    background: var(--bg); border: 2px solid var(--line); border-radius: 12px;
  }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=file] { display: none; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
  .warn { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin: 0 0 12px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumb { width: calc(33.3% - 6px); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
  .thumb img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; }
  .thumb .ctl { display: flex; justify-content: space-between; margin-top: 4px; }
  .thumb button {
    flex: 1; font: inherit; font-size: 15px; padding: 6px 0; border: 0; background: transparent; color: var(--ink);
  }
  .bar { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; margin-top: 10px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  #result img, #result video { width: 100%; border-radius: 14px; display: block; background: #000; }
  #result video { max-width: 320px; margin-inline: auto; }
  [hidden] { display: none !important; }
</style>
<script src="mp4-muxer.js"></script>
</head>
<body>
<div class="wrap">
  <h1>🎂 사진 카드 만들기</h1>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-img" aria-selected="true">📷 이미지 (JPG)</button>
    <button class="tab" role="tab" id="tab-vid" aria-selected="false">🎬 영상 (MP4)</button>
  </div>

  <!-- 이미지 -->
  <section id="pane-img">
    <div class="step">
      <canvas id="icanvas" class="preview" width="1080" height="1350"></canvas>
      <p class="hint">사진을 손가락으로 끌면 위치가 바뀌어요.</p>
    </div>
    <div class="step">
      <h2><span>①</span>틀 고르기</h2>
      <div class="tpls" id="itpls"></div>
    </div>
    <div class="step">
      <h2><span>②</span>사진 고르기</h2>
      <label class="btn second" for="ifile" style="text-align:center">📂 사진 한 장 고르기</label>
      <input type="file" id="ifile" accept="image/*">
      <label for="izoom">확대</label>
      <input type="range" id="izoom" min="1" max="3" step="0.01" value="1">
    </div>
  </section>

  <!-- 영상 -->
  <section id="pane-vid" hidden>
    <p class="warn" id="vwarn" hidden></p>
    <div class="step">
      <canvas id="vcanvas" class="preview" width="1080" height="1920"></canvas>
      <input type="range" id="vseek" min="0" max="1000" value="100" aria-label="미리보기 위치">
      <div class="row"><button class="btn second" id="vplay">▶ 미리보기 재생</button></div>
    </div>
    <div class="step">
      <h2><span>①</span>틀 고르기</h2>
      <div class="tpls" id="vtpls"></div>
    </div>
    <div class="step">
      <h2><span>②</span>사진 3~5장 고르기</h2>
      <label class="btn second" for="vfile" style="text-align:center">📂 사진 고르기</label>
      <input type="file" id="vfile" accept="image/*" multiple>
      <p class="hint" id="vcount">아직 고른 사진이 없어요.</p>
      <div class="thumbs" id="vthumbs"></div>
    </div>
  </section>

  <!-- 글자 (이미지·영상 공통) -->
  <div class="step">
    <h2><span>③</span>글자 고치기</h2>
    <label for="t-title">큰 문구</label>
    <input type="text" id="t-title" value="Happy Birthday!" autocomplete="off">
    <label for="t-line2">누구의 생일인가요?</label>
    <input type="text" id="t-line2" value="OOO의 생일" autocomplete="off">
    <label for="t-date">날짜</label>
    <input type="text" id="t-date" autocomplete="off">
    <div id="outro-wrap" hidden>
      <label for="t-outro">영상 마지막 문구</label>
      <input type="text" id="t-outro" value="사랑해요 ♥" autocomplete="off">
    </div>
    <p class="hint">큰 문구는 그대로 두고, 이름과 날짜만 바꾸면 돼요. 날짜는 열 때마다 오늘로 채워져요.</p>
  </div>

  <div class="step">
    <h2><span>④</span>만들기</h2>
    <button class="btn" id="make">만들기</button>
    <div class="bar" id="bar" hidden><i></i></div>
    <p class="hint" id="status"></p>
    <div id="result" hidden>
      <div id="rmedia"></div>
      <div class="row">
        <button class="btn" id="save">💾 저장하기</button>
        <button class="btn second" id="share" hidden>📤 공유하기</button>
      </div>
      <p class="hint" id="rhint"></p>
    </div>
  </div>
</div>

<script>
'use strict';
// ───────── 공통 ─────────
const $ = (s) => document.querySelector(s);
const TITLE_FONT = 'Georgia, "Times New Roman", "Noto Serif KR", serif';
const BODY_FONT = '"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR","Noto Sans KR",sans-serif';
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

function store(key, val) {
  try { if (val === undefined) return localStorage.getItem('fm.' + key); localStorage.setItem('fm.' + key, val); } catch (e) { /* 저장 불가여도 동작 */ }
  return null;
}
function todayText() {
  const d = new Date();
  return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`;
}
function fileStamp() {
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// 글자가 maxW보다 길면 글자 크기를 줄여서 맞춤
function text(ctx, str, x, y, o) {
  const fam = o.serif ? TITLE_FONT : BODY_FONT;
  let size = o.size;
  const set = () => { ctx.font = `${o.italic ? 'italic ' : ''}${o.weight || 700} ${size}px ${fam}`; };
  set();
  while (ctx.measureText(str).width > o.maxW && size > 20) { size -= 2; set(); }
  ctx.fillStyle = o.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(str, x, y);
}
function rng(seed) {
  return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// 사진을 슬롯에 꽉 채워 그림 (view로 확대·이동)
function drawCover(ctx, src, slot, view, extra = 1) {
  const base = Math.max(slot.w / src.width, slot.h / src.height) * view.zoom * extra;
  const dw = src.width * base, dh = src.height * base;
  const mx = Math.max(0, (dw - slot.w) / 2), my = Math.max(0, (dh - slot.h) / 2);
  view.ox = clamp(view.ox, -mx, mx);
  view.oy = clamp(view.oy, -my, my);
  ctx.drawImage(src, slot.x + (slot.w - dw) / 2 + view.ox, slot.y + (slot.h - dh) / 2 + view.oy, dw, dh);
}
function placeholder(ctx, slot, label) {
  ctx.fillStyle = '#d9d2d4';
  ctx.fillRect(slot.x, slot.y, slot.w, slot.h);
  text(ctx, label, slot.x + slot.w / 2, slot.y + slot.h / 2, { size: 44, color: '#8c8286', maxW: slot.w - 60, weight: 600 });
}
function confetti(ctx, W, H, seed, count, t = 0) {
  const r = rng(seed), colors = ['#ff6b9d', '#ffd166', '#4dabf7', '#69db7c', '#b197fc', '#ff922b'];
  for (let i = 0; i < count; i++) {
    const x = r() * W, y0 = r() * (H + 200), sp = 80 + r() * 160, s = 10 + r() * 16, c = colors[Math.floor(r() * colors.length)], rot = r() * 6.28;
    const y = ((y0 + t * sp) % (H + 200)) - 100;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot + t * 2); ctx.fillStyle = c; ctx.fillRect(-s / 2, -s / 4, s, s / 2); ctx.restore();
  }
}
function flower(ctx, x, y, r, c) {
  ctx.fillStyle = c;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * r * 0.6, y + Math.sin(a) * r * 0.6, r * 0.5, 0, 6.3); ctx.fill();
  }
  ctx.fillStyle = '#ffd43b'; ctx.beginPath(); ctx.arc(x, y, r * 0.35, 0, 6.3); ctx.fill();
}
function gradient(ctx, W, H, c1, c2) {
  const g = ctx.createLinearGradient(0, 0, W * 0.3, H);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// 큰 사진은 긴 변 2000px로 줄여서 메모리를 아낌
async function loadPhoto(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight;
  const k = Math.min(1, 2000 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  return c;
}

// ───────── 글자 입력 ─────────
const T = { title: $('#t-title'), line2: $('#t-line2'), date: $('#t-date'), outro: $('#t-outro') };
for (const k of ['title', 'line2', 'outro']) { const v = store(k); if (v) T[k].value = v; }
T.date.value = todayText();
function texts() { return { title: T.title.value, line2: T.line2.value, date: T.date.value, outro: T.outro.value }; }

// ───────── 이미지 틀 ─────────
const IW = 1080, IH = 1350;
const IMG_TPLS = [
  { id: 'card', name: '🎀 생일 카드',
    slot: { x: 110, y: 330, w: 860, h: 740, r: 40 },
    draw(ctx, S) {
      gradient(ctx, IW, IH, '#ffe3ec', '#fff3d6');
      confetti(ctx, IW, IH, 7, 38);
      text(ctx, S.t.title, IW / 2, 140, { size: 118, color: '#d6336c', maxW: 940, serif: true, italic: true });
      text(ctx, S.t.line2, IW / 2, 240, { size: 58, color: '#6b4a56', maxW: 900 });
      ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.18)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
      rrect(ctx, 96, 316, 888, 768, 48); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
      S.photo(this.slot);
      text(ctx, S.t.date, IW / 2, 1170, { size: 46, color: '#6b4a56', maxW: 900, weight: 600 });
      text(ctx, '♥  ♥  ♥', IW / 2, 1260, { size: 52, color: '#ff6b9d', maxW: 400 });
    } },
  { id: 'polaroid', name: '📸 폴라로이드',
    slot: { x: 40, y: 40, w: 720, h: 720, r: 0 },
    draw(ctx, S) {
      gradient(ctx, IW, IH, '#efe6d8', '#e4d6c2');
      ctx.save(); ctx.translate(IW / 2, IH / 2); ctx.rotate(-0.04); ctx.translate(-400, -520);
      ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
      ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, 800, 1040); ctx.shadowColor = 'transparent';
      S.photo(this.slot);
      text(ctx, S.t.title, 400, 850, { size: 72, color: '#5b4636', maxW: 700, serif: true, italic: true });
      text(ctx, S.t.line2, 400, 930, { size: 46, color: '#5b4636', maxW: 700 });
      text(ctx, S.t.date, 400, 990, { size: 34, color: '#8a7766', maxW: 700, weight: 600 });
      ctx.restore();
    } },
  { id: 'flower', name: '🌸 꽃 테두리',
    slot: { x: 160, y: 300, w: 760, h: 760, r: 380 },
    draw(ctx, S) {
      ctx.fillStyle = '#fffaf0'; ctx.fillRect(0, 0, IW, IH);
      const r = rng(21), cols = ['#ff8787', '#ffa8a8', '#faa2c1', '#ffc078', '#da77f2', '#74c0fc'];
      for (let x = 30; x < IW; x += 62) { flower(ctx, x, 36, 26, cols[Math.floor(r() * 6)]); flower(ctx, x + 31, IH - 36, 26, cols[Math.floor(r() * 6)]); }
      for (let y = 100; y < IH - 60; y += 62) { flower(ctx, 36, y, 26, cols[Math.floor(r() * 6)]); flower(ctx, IW - 36, y + 31, 26, cols[Math.floor(r() * 6)]); }
      text(ctx, S.t.title, IW / 2, 150, { size: 108, color: '#e8590c', maxW: 880, serif: true, italic: true });
      text(ctx, S.t.line2, IW / 2, 235, { size: 54, color: '#5f3dc4', maxW: 880 });
      ctx.beginPath(); ctx.arc(540, 680, 392, 0, 6.3); ctx.fillStyle = '#ffd43b'; ctx.fill();
      S.photo(this.slot);
      text(ctx, S.t.date, IW / 2, 1160, { size: 48, color: '#5b4636', maxW: 880, weight: 600 });
    } },
  { id: 'dark', name: '✨ 골드 다크',
    slot: { x: 90, y: 360, w: 900, h: 700, r: 14 },
    draw(ctx, S) {
      gradient(ctx, IW, IH, '#14213d', '#0b1426');
      const r = rng(5); ctx.fillStyle = 'rgba(252,163,17,.55)';
      for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc(r() * IW, r() * IH, 2 + r() * 4, 0, 6.3); ctx.fill(); }
      text(ctx, S.t.title, IW / 2, 170, { size: 118, color: '#fca311', maxW: 940, serif: true, italic: true });
      text(ctx, S.t.line2, IW / 2, 275, { size: 56, color: '#ffffff', maxW: 900 });
      ctx.strokeStyle = '#fca311'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(300, 325); ctx.lineTo(780, 325); ctx.stroke();
      ctx.fillStyle = '#fca311'; ctx.fillRect(78, 348, 924, 724);
      S.photo(this.slot);
      text(ctx, S.t.date, IW / 2, 1170, { size: 46, color: '#ffffff', maxW: 900, weight: 600 });
    } },
];

const I = { tpl: IMG_TPLS[0], photo: null, view: { zoom: 1, ox: 0, oy: 0 } };
const icv = $('#icanvas'), ictx = icv.getContext('2d');
function renderImage() {
  const S = {
    t: texts(),
    photo: (slot) => {
      ictx.save(); rrect(ictx, slot.x, slot.y, slot.w, slot.h, slot.r); ictx.clip();
      if (I.photo) drawCover(ictx, I.photo, slot, I.view); else placeholder(ictx, slot, '사진을 골라 주세요');
      ictx.restore();
    },
  };
  ictx.clearRect(0, 0, IW, IH);
  I.tpl.draw(ictx, S);
}
function renderImageSoon() { cancelAnimationFrame(renderImageSoon.id); renderImageSoon.id = requestAnimationFrame(renderImage); }

function buildTplButtons(list, host, current, onPick) {
  host.innerHTML = '';
  list.forEach((t) => {
    const b = document.createElement('button');
    b.className = 'tpl'; b.textContent = t.name; b.setAttribute('aria-pressed', t === current ? 'true' : 'false');
    b.onclick = () => { [...host.children].forEach((c) => c.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); onPick(t); };
    host.appendChild(b);
  });
}
buildTplButtons(IMG_TPLS, $('#itpls'), I.tpl, (t) => { I.tpl = t; I.view.ox = I.view.oy = 0; renderImage(); });

$('#ifile').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { I.photo = await loadPhoto(f); I.view = { zoom: 1, ox: 0, oy: 0 }; $('#izoom').value = 1; renderImage(); }
  catch (err) { $('#status').textContent = '이 사진은 열 수 없어요. 다른 사진을 골라 주세요.'; }
};
$('#izoom').oninput = (e) => { I.view.zoom = +e.target.value; renderImageSoon(); };
(() => {
  let down = false, lx = 0, ly = 0;
  icv.addEventListener('pointerdown', (e) => { down = true; lx = e.clientX; ly = e.clientY; icv.setPointerCapture(e.pointerId); });
  icv.addEventListener('pointermove', (e) => {
    if (!down) return;
    const k = icv.width / icv.getBoundingClientRect().width;
    I.view.ox += (e.clientX - lx) * k; I.view.oy += (e.clientY - ly) * k; lx = e.clientX; ly = e.clientY;
    renderImageSoon();
  });
  const up = () => { down = false; };
  icv.addEventListener('pointerup', up); icv.addEventListener('pointercancel', up);
})();

// ───────── 영상 틀 ─────────
const VW = 1080, VH = 1920, FPS = 30, INTRO = 2, OUTRO = 2, FADE = 0.45;
const VID_TPLS = [
  { id: 'pink', name: '🎀 핑크 파티', bg: ['#ffe3ec', '#fff3d6'], titleC: '#d6336c', textC: '#6b4a56', confetti: true, frame: 'round',
    slot: { x: 90, y: 380, w: 900, h: 1160, r: 48 } },
  { id: 'cream', name: '📸 폴라로이드', bg: ['#efe6d8', '#e4d6c2'], titleC: '#8a5a3c', textC: '#5b4636', confetti: false, frame: 'polaroid',
    slot: { x: 150, y: 400, w: 780, h: 900, r: 0 } },
  { id: 'dark', name: '✨ 골드 다크', bg: ['#14213d', '#0b1426'], titleC: '#fca311', textC: '#ffffff', confetti: false, frame: 'full',
    slot: { x: 0, y: 380, w: 1080, h: 1160, r: 0 } },
];
const V = { tpl: VID_TPLS[0], photos: [] };
const vcv = $('#vcanvas'), vctx = vcv.getContext('2d');

function vTiming(n) {
  const pd = Math.min(2.6, (15 - INTRO - OUTRO) / n);
  return { pd, total: INTRO + n * pd + OUTRO };
}
function drawVideoFrame(ctx, t, cfg, photos, n, tx) {
  const { pd } = vTiming(n), tOut = INTRO + n * pd, cx = VW / 2;
  gradient(ctx, VW, VH, cfg.bg[0], cfg.bg[1]);

  // 시작 화면
  const ia = t < INTRO ? 1 : 1 - clamp((t - INTRO) / FADE);
  if (ia > 0) {
    ctx.save(); ctx.globalAlpha = ia;
    if (cfg.confetti) confetti(ctx, VW, VH, 11, 46, t);
    const s = 0.8 + 0.2 * ease(t / 0.8);
    ctx.translate(cx, 800); ctx.scale(s, s); ctx.globalAlpha = ia * clamp(t / 0.5);
    text(ctx, tx.title, 0, 0, { size: 150, color: cfg.titleC, maxW: 960, serif: true, italic: true });
    text(ctx, tx.line2, 0, 160, { size: 76, color: cfg.textC, maxW: 940 });
    text(ctx, tx.date, 0, 280, { size: 52, color: cfg.textC, maxW: 940, weight: 600 });
    ctx.restore();
  }

  // 사진들 (앞 사진 위로 뒷 사진이 서서히 겹쳐 나타남)
  for (let i = 0; i < n; i++) {
    const st = INTRO + i * pd;
    if (t < st || t >= st + pd + FADE) continue;
    const a = clamp((t - st) / FADE), p = (t - st) / (pd + FADE);
    drawVideoPhoto(ctx, cfg, photos[i] || null, i, p, a);
  }

  // 사진 보는 동안 이름·날짜 표시
  const ca = clamp((t - INTRO) / FADE) * (1 - clamp((t - tOut) / FADE));
  if (ca > 0) {
    ctx.save(); ctx.globalAlpha = ca;
    text(ctx, tx.title, cx, 190, { size: 96, color: cfg.titleC, maxW: 960, serif: true, italic: true });
    text(ctx, tx.line2, cx, 290, { size: 56, color: cfg.textC, maxW: 940 });
    text(ctx, tx.date, cx, 1720, { size: 50, color: cfg.textC, maxW: 940, weight: 600 });
    ctx.restore();
  }

  // 마무리 화면
  const oa = clamp((t - tOut) / FADE);
  if (oa > 0) {
    ctx.save(); ctx.globalAlpha = oa;
    gradient(ctx, VW, VH, cfg.bg[0], cfg.bg[1]);
    if (cfg.confetti) confetti(ctx, VW, VH, 29, 46, t);
    const s = 0.85 + 0.15 * ease((t - tOut) / 0.8);
    ctx.translate(cx, 880); ctx.scale(s, s);
    text(ctx, tx.outro, 0, 0, { size: 130, color: cfg.titleC, maxW: 940, serif: true, italic: true });
    text(ctx, tx.date, 0, 150, { size: 52, color: cfg.textC, maxW: 940, weight: 600 });
    ctx.restore();
  }
}
function drawVideoPhoto(ctx, cfg, src, i, p, alpha) {
  const slot = cfg.slot;
  ctx.save(); ctx.globalAlpha = alpha;
  if (cfg.frame === 'polaroid') {
    const rot = (i % 2 ? 1 : -1) * 0.035;
    ctx.translate(slot.x + slot.w / 2, slot.y + slot.h / 2); ctx.rotate(rot); ctx.translate(-(slot.x + slot.w / 2), -(slot.y + slot.h / 2));
    ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
    ctx.fillStyle = '#fffdf8'; ctx.fillRect(slot.x - 40, slot.y - 40, slot.w + 80, slot.h + 200);
    ctx.shadowColor = 'transparent';
  } else if (cfg.frame === 'round') {
    ctx.shadowColor = 'rgba(0,0,0,.2)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10;
    rrect(ctx, slot.x - 16, slot.y - 16, slot.w + 32, slot.h + 32, slot.r + 12); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.shadowColor = 'transparent';
  } else {
    ctx.fillStyle = '#fca311'; ctx.fillRect(0, slot.y - 12, VW, slot.h + 24);
  }
  rrect(ctx, slot.x, slot.y, slot.w, slot.h, slot.r); ctx.clip();
  if (src) drawCover(ctx, src, slot, { zoom: 1, ox: 0, oy: 0 }, 1 + 0.07 * p);
  else placeholder(ctx, slot, `사진 ${i + 1}`);
  ctx.restore();
}

buildTplButtons(VID_TPLS, $('#vtpls'), V.tpl, (t) => { V.tpl = t; renderVideoPreview(); });
function vCount() { return Math.max(3, Math.min(5, V.photos.length)); }
function renderVideoPreview() {
  const n = vCount(), { total } = vTiming(n);
  const t = (+$('#vseek').value / 1000) * (total - 0.01);
  drawVideoFrame(vctx, t, V.tpl, V.photos, n, texts());
}
$('#vseek').oninput = () => { stopPlay(); renderVideoPreview(); };
let playing = false;
function stopPlay() { playing = false; $('#vplay').textContent = '▶ 미리보기 재생'; }
$('#vplay').onclick = () => {
  if (playing) { stopPlay(); return; }
  playing = true; $('#vplay').textContent = '⏸ 멈추기';
  const n = vCount(), { total } = vTiming(n), t0 = performance.now();
  (function tick(now) {
    if (!playing) return;
    const t = (now - t0) / 1000;
    if (t >= total) { stopPlay(); return; }
    $('#vseek').value = (t / total) * 1000;
    drawVideoFrame(vctx, t, V.tpl, V.photos, n, texts());
    requestAnimationFrame(tick);
  })(t0);
};

function refreshThumbs() {
  const host = $('#vthumbs'); host.innerHTML = '';
  V.photos.forEach((c, i) => {
    const d = document.createElement('div'); d.className = 'thumb';
    const im = document.createElement('img'); im.alt = `사진 ${i + 1}`;
    const tc = document.createElement('canvas'); tc.width = tc.height = 160;
    drawCover(tc.getContext('2d'), c, { x: 0, y: 0, w: 160, h: 160 }, { zoom: 1, ox: 0, oy: 0 });
    im.src = tc.toDataURL('image/jpeg', 0.7);
    const ctl = document.createElement('div'); ctl.className = 'ctl';
    const mk = (label, fn, aria) => { const b = document.createElement('button'); b.textContent = label; b.setAttribute('aria-label', aria); b.onclick = fn; return b; };
    ctl.append(
      mk('◀', () => { if (i > 0) { [V.photos[i - 1], V.photos[i]] = [V.photos[i], V.photos[i - 1]]; refreshThumbs(); } }, '앞으로'),
      mk('✕', () => { V.photos.splice(i, 1); refreshThumbs(); }, '지우기'),
      mk('▶', () => { if (i < V.photos.length - 1) { [V.photos[i + 1], V.photos[i]] = [V.photos[i], V.photos[i + 1]]; refreshThumbs(); } }, '뒤로'));
    d.append(im, ctl); host.appendChild(d);
  });
  const n = V.photos.length;
  $('#vcount').textContent = n === 0 ? '아직 고른 사진이 없어요.' : n < 3 ? `${n}장 골랐어요. ${3 - n}장 더 골라 주세요.` : `${n}장 골랐어요. 순서는 ◀ ▶ 로 바꿀 수 있어요.`;
  renderVideoPreview();
}
$('#vfile').onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = '';
  const room = 5 - V.photos.length;
  if (files.length > room) $('#status').textContent = '사진은 최대 5장까지예요. 앞의 사진만 넣었어요.';
  for (const f of files.slice(0, room)) {
    try { V.photos.push(await loadPhoto(f)); } catch (err) { $('#status').textContent = '열 수 없는 사진은 건너뛰었어요.'; }
  }
  refreshThumbs();
};

// ───────── 영상(mp4) 만들기 ─────────
const canEncode = 'VideoEncoder' in window && typeof Mp4Muxer !== 'undefined';
if (!canEncode) {
  $('#vwarn').hidden = false;
  $('#vwarn').textContent = '이 브라우저에서는 MP4를 바로 만들 수 없어서, 가능하면 다른 형식(webm)으로 저장돼요. 크롬이나 엣지를 쓰면 MP4로 만들어져요.';
}
async function pickCodec() {
  for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42E028']) {
    try { const r = await VideoEncoder.isConfigSupported({ codec, width: VW, height: VH, bitrate: 6e6, framerate: FPS }); if (r.supported) return codec; } catch (e) { /* 다음 코덱 */ }
  }
  return null;
}
async function encodeMp4(canvas, ctx, n, onProgress) {
  const codec = await pickCodec();
  if (!codec) return null;
  const { total } = vTiming(n), frames = Math.round(total * FPS);
  const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), video: { codec: 'avc', width: VW, height: VH }, fastStart: 'in-memory' });
  let encErr = null;
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: (e) => { encErr = e; } });
  enc.configure({ codec, width: VW, height: VH, bitrate: 6e6, framerate: FPS });
  const tx = texts();
  for (let i = 0; i < frames; i++) {
    if (encErr) throw encErr;
    drawVideoFrame(ctx, i / FPS, V.tpl, V.photos, n, tx);
    const f = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / FPS), duration: Math.round(1e6 / FPS) });
    enc.encode(f, { keyFrame: i % FPS === 0 }); f.close();
    while (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    if (i % 5 === 0) { onProgress(i / frames); await new Promise((r) => setTimeout(r)); }
  }
  await enc.flush(); muxer.finalize();
  return new Blob([muxer.target.buffer], { type: 'video/mp4' });
}
// 대비책: 화면을 실시간으로 녹화 (기기에 따라 webm이 될 수 있음)
async function recordFallback(canvas, ctx, n, onProgress) {
  const { total } = vTiming(n), tx = texts();
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error('no recorder');
  const rec = new MediaRecorder(canvas.captureStream(FPS), { mimeType: mime, videoBitsPerSecond: 6e6 });
  const chunks = []; rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const done = new Promise((r) => { rec.onstop = r; });
  rec.start(); const t0 = performance.now();
  await new Promise((resolve) => {
    (function tick(now) {
      const t = (now - t0) / 1000;
      if (t >= total) return resolve();
      drawVideoFrame(ctx, t, V.tpl, V.photos, n, tx); onProgress(t / total); requestAnimationFrame(tick);
    })(t0);
  });
  rec.stop(); await done;
  return new Blob(chunks, { type: mime.split(';')[0] });
}

// ───────── 만들기·저장·공유 ─────────
let tab = 'img', out = null;
function setTab(name) {
  tab = name; stopPlay();
  $('#pane-img').hidden = name !== 'img'; $('#pane-vid').hidden = name !== 'vid';
  $('#outro-wrap').hidden = name !== 'vid';
  $('#tab-img').setAttribute('aria-selected', name === 'img'); $('#tab-vid').setAttribute('aria-selected', name === 'vid');
  $('#result').hidden = true; $('#status').textContent = '';
  if (name === 'vid') renderVideoPreview(); else renderImage();
}
$('#tab-img').onclick = () => setTab('img'); $('#tab-vid').onclick = () => setTab('vid');
for (const k of ['title', 'line2', 'outro']) T[k].addEventListener('input', () => store(k, T[k].value));
for (const el of Object.values(T)) el.addEventListener('input', () => { if (tab === 'img') renderImageSoon(); else renderVideoPreview(); });

function showResult(blob, ext) {
  out = { blob, name: `${tab === 'img' ? '생일사진' : '생일영상'}_${fileStamp()}.${ext}` };
  const url = URL.createObjectURL(blob), host = $('#rmedia');
  host.innerHTML = '';
  const el = document.createElement(tab === 'img' ? 'img' : 'video');
  el.src = url; if (tab === 'vid') { el.controls = true; el.playsInline = true; } else el.alt = '만든 이미지';
  host.appendChild(el);
  $('#result').hidden = false;
  $('#share').hidden = !(navigator.canShare && navigator.canShare({ files: [new File([blob], out.name, { type: blob.type })] }));
  $('#rhint').textContent = ext === 'webm' ? '이 기기에서는 webm 형식으로 만들어졌어요. 재생은 잘 되지만 MP4가 필요하면 크롬이나 엣지로 다시 만들어 주세요.' : '저장하기를 누르면 기기의 다운로드 폴더에 저장돼요.';
  $('#result').scrollIntoView({ behavior: 'smooth', block: 'center' });
}
$('#save').onclick = () => {
  if (!out) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(out.blob); a.download = out.name;
  document.body.appendChild(a); a.click(); a.remove();
};
$('#share').onclick = async () => {
  if (!out) return;
  try { await navigator.share({ files: [new File([out.blob], out.name, { type: out.blob.type })] }); } catch (e) { /* 취소 */ }
};
$('#make').onclick = async () => {
  const btn = $('#make'), bar = $('#bar'), status = $('#status');
  $('#result').hidden = true; status.textContent = '';
  try {
    if (tab === 'img') {
      if (!I.photo) { status.textContent = '먼저 사진을 한 장 골라 주세요.'; return; }
      renderImage();
      const blob = await new Promise((r) => icv.toBlob(r, 'image/jpeg', 0.92));
      showResult(blob, 'jpg');
      return;
    }
    if (V.photos.length < 3) { status.textContent = '사진을 3장 이상 골라 주세요.'; return; }
    btn.disabled = true; bar.hidden = false; stopPlay();
    const n = Math.min(5, V.photos.length), fill = bar.firstElementChild;
    const prog = (p) => { fill.style.width = `${Math.round(p * 100)}%`; status.textContent = `영상을 만드는 중이에요… ${Math.round(p * 100)}%`; };
    const cv = document.createElement('canvas'); cv.width = VW; cv.height = VH;
    const c2 = cv.getContext('2d');
    let blob = null, ext = 'mp4';
    if (canEncode) { try { blob = await encodeMp4(cv, c2, n, prog); } catch (e) { blob = null; } }
    if (!blob) { status.textContent = '다른 방법으로 만들어 볼게요. 화면을 켜 둔 채로 기다려 주세요.'; blob = await recordFallback(cv, c2, n, prog); ext = blob.type.includes('mp4') ? 'mp4' : 'webm'; }
    status.textContent = '완성됐어요! 🎉';
    showResult(blob, ext);
  } catch (e) {
    status.textContent = '앗, 만들지 못했어요. 사진을 줄여서 다시 해 보거나 크롬·엣지로 열어 주세요.';
  } finally {
    btn.disabled = false; $('#bar').hidden = true;
  }
};

renderImage();
</script>
